services:
  app:
    build: .
    ports:
      - "8081:8080"
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - db
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pingdom_dev

  db:
    image: postgis/postgis:15-3.4  # 앱이 ST_DWithin/ST_MakePoint 등 PostGIS 함수를 사용
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pingdom_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
