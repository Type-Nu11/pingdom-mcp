name: Deploy MCP Server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy on the instance
        required: true
        default: main
        type: string

permissions:
  contents: read

# 같은 운영 인스턴스에 여러 배포가 동시에 들어가지 않도록 한다.
concurrency:
  group: mcp-server-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and deploy on instance
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
      # 배포 원인 분석용 임시 디버그 모드. SSH 키와 .env 값은 출력하지 않는다.
      DEPLOY_DEBUG: 'true'

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_BRANCH; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions secret/input is missing: ${name}" >&2
              exit 1
            fi
          done

          if [[ "${DEPLOY_PATH}" != /* || "${DEPLOY_PATH}" == "/" ]]; then
            echo "DEPLOY_PATH must be an absolute, non-root path" >&2
            exit 1
          fi
          if [[ ! "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ || ! "${DEPLOY_USER}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "DEPLOY_HOST or DEPLOY_USER contains unsupported characters" >&2
            exit 1
          fi
          if [[ ! "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9_./-]+$ || "${DEPLOY_PATH}" == *"/../"* || "${DEPLOY_PATH}" == */.. ]]; then
            echo "DEPLOY_PATH contains unsupported characters or parent-directory traversal" >&2
            exit 1
          fi
          if [[ ! "${DEPLOY_BRANCH}" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "DEPLOY_BRANCH contains unsupported characters" >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull, deploy, and verify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_DEBUG}" == "true" ]]; then
            set -x
          fi
          remote_command="sh -s -- '${DEPLOY_PATH}' '${DEPLOY_BRANCH}' '${DEPLOY_DEBUG}'"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "$remote_command" <<'REMOTE_SCRIPT'
          set -eu

          debug_mode=$3
          if [ "$debug_mode" = "true" ]; then
              set -x
          fi

          deploy_path=$1
          deploy_branch=$2
          repository_url='https://github.com/Type-Nu11/pingdom-mcp.git'

          if [ ! -d "$deploy_path/.git" ]; then
              if [ -e "$deploy_path" ] && [ -n "$(find "$deploy_path" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                  echo "Deployment path exists and is not an empty Git checkout: $deploy_path" >&2
                  exit 1
              fi
              mkdir -p "$(dirname "$deploy_path")"
              git clone --branch "$deploy_branch" --single-branch "$repository_url" "$deploy_path"
          else
              origin_url=$(git -C "$deploy_path" remote get-url origin)
              case "$origin_url" in
                  https://github.com/Type-Nu11/pingdom-mcp.git|https://github.com/Type-Nu11/pingdom-mcp) ;;
                  *)
                      echo "Unexpected origin URL in deployment checkout: $origin_url" >&2
                      exit 1
                      ;;
              esac

              # 이전 배포에서 생성된 로그/PID/컴파일 산출물은 소스 변경이 아니므로
              # 체크아웃을 갱신하기 전에 정리한다. 운영 .env는 정리 대상이 아니다.
              git -C "$deploy_path" restore -- logs/access.log logs/error.log logs/nginx.pid nginx.conf.compiled 2>/dev/null || true

              if [ -n "$(git -C "$deploy_path" status --porcelain)" ]; then
                  echo "Remote checkout changes before deployment:" >&2
                  git -C "$deploy_path" status --short >&2
                  # 운영 서버에서 실수로 수정된 추적 파일도 삭제하지 않고 보관한 뒤 배포한다.
                  # .env는 ignored 파일이므로 --include-untracked 대상에도 포함되지 않는다.
                  stash_name="pre-deploy-$(date +%Y%m%d%H%M%S)"
                  echo "Deployment checkout has local changes; preserving them in git stash: ${stash_name}" >&2
                  git -C "$deploy_path" stash push --include-untracked --message "$stash_name"
                  git -C "$deploy_path" stash list -1 >&2
              fi

              git -C "$deploy_path" fetch origin "$deploy_branch"
              if git -C "$deploy_path" show-ref --verify --quiet "refs/heads/$deploy_branch"; then
                  git -C "$deploy_path" checkout "$deploy_branch"
              else
                  git -C "$deploy_path" checkout --track -b "$deploy_branch" "origin/$deploy_branch"
              fi
              git -C "$deploy_path" pull --ff-only origin "$deploy_branch"
          fi

          cd "$deploy_path"
          if [ ! -s .env ]; then
              echo "Missing deployment .env file; provision production settings before deploying." >&2
              exit 1
          fi

          sudo -n docker compose config --quiet
          sudo -n docker compose ps >&2
          # healthcheck가 통과한 새 컨테이너가 준비될 때까지 배포 명령이 대기한다.
          sudo -n docker compose up -d --build --no-deps --wait app

          health_status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8081/health)
          echo "MCP health-check HTTP status: $health_status" >&2
          if [ "$health_status" != "200" ]; then
              echo "Unexpected MCP health-check status: $health_status (expected 200)" >&2
              exit 1
          fi

          echo "MCP deployment and health check passed (status=$health_status)."
          REMOTE_SCRIPT
